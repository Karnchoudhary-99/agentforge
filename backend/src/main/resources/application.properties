spring.application.name=agentforge-api
server.port=${SERVER_PORT:8080}
spring.jackson.serialization.write-dates-as-timestamps=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Provider credentials are read server-side only. No API key is required for health checks.
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}

# Access control: configure a strong secret in AGENTFORGE_API_TOKEN before using tool/approval endpoints. Blank token fails closed.\nagentforge.security.api-token=${AGENTFORGE_API_TOKEN:}\n\n# Tool policy: server-side allowlist, small payloads, bounded concurrency, no automatic retries.
agentforge.tools.allowed=${AGENTFORGE_ALLOWED_TOOLS:text.word-count}
agentforge.tools.max-input-bytes=${AGENTFORGE_TOOL_MAX_INPUT_BYTES:8192}
agentforge.tools.timeout-ms=${AGENTFORGE_TOOL_TIMEOUT_MS:2000}
agentforge.tools.max-concurrent=${AGENTFORGE_TOOL_MAX_CONCURRENT:4}
agentforge.tools.queue-capacity=${AGENTFORGE_TOOL_QUEUE_CAPACITY:16}

# Database configuration is activated as persistence is introduced in later sessions.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agentforge}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:agentforge}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:agentforge_local_only}
