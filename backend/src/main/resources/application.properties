spring.application.name=agentforge-api
server.port=${SERVER_PORT:8080}
spring.jackson.serialization.write-dates-as-timestamps=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Spring AI provider settings are supplied through the server process environment.
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}

# Tool policy: server-side allowlist, small payloads, bounded concurrency, no automatic retries.
agentforge.tools.allowed=${AGENTFORGE_ALLOWED_TOOLS:text.word-count}
agentforge.tools.max-input-bytes=${AGENTFORGE_TOOL_MAX_INPUT_BYTES:8192}
agentforge.tools.timeout-ms=${AGENTFORGE_TOOL_TIMEOUT_MS:2000}
agentforge.tools.max-concurrent=${AGENTFORGE_TOOL_MAX_CONCURRENT:4}
agentforge.tools.queue-capacity=${AGENTFORGE_TOOL_QUEUE_CAPACITY:16}

# PostgreSQL is the source of truth for run records and timeline events.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agentforge}
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
